name: totalUnit
description: "A converter for everything"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  http: ^1.1.0
  image: ^4.5.2
  flutter_image_compress: ^2.3.0
  ffmpeg_kit_flutter_new: ^4.1.0
  connectivity_plus: ^7.1.1
  in_app_purchase: ^3.2.0
  gal: ^2.3.2
  file_picker: ^8.0.0
  archive: ^4.0.9
  xml: ^6.5.0
  pdf: ^3.11.0
  path_provider: ^2.1.2
  file_saver: ^0.2.11
  google_mobile_ads: ^8.0.0

dev_dependencies:
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0B0B10"
  image: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#0B0B10"
    icon_background_color: "#0B0B10"
  fullscreen: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/splash_logo.png
    - assets/images/

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Bold.ttf
          weight: 700